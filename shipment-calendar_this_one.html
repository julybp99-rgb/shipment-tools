<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shipment Calendar</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root {
    --navy: #0f1f3d;
    --navy-light: #2a4a8a;
    --steel: #3d5a99;
    --ice: #e8eef8;
    --ice-dark: #d0daf0;
    --white: #ffffff;
    --text: #1a2540;
    --text-muted: #5a6a8a;
    --border: #c8d4ec;
    --status-ok: #0d7a4e;     --status-ok-bg: #e6f7f1;
    --status-wait: #b36800;   --status-wait-bg: #fff4e0;
    --status-done: #1a5cb5;   --status-done-bg: #e6eeff;
    --cnt-add: #0d7a4e;       --cnt-add-bg: #e6f7f1;
    --cnt-cut: #c0392b;       --cnt-cut-bg: #fdecea;
    --cnt-delay: #7b4fa6;     --cnt-delay-bg: #f3ecfc;
    --lb-printed: #0d7a4e;    --lb-printed-bg: #e6f7f1;
    --lb-notyet: #888;        --lb-notyet-bg: #f0f0f0;
    --today-ring: #f5a623;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'IBM Plex Sans Thai', sans-serif;
    background: var(--ice);
    color: var(--text);
    min-height: 100vh;
    user-select: none;
  }

  /* ── HEADER ── */
  header {
    background: var(--navy); padding: 0 28px; height: 64px;
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 2px 12px rgba(0,0,0,0.25);
  }
  .header-left { display: flex; align-items: center; gap: 14px; }
  .logo-mark {
    width: 36px; height: 36px; background: var(--steel); border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'IBM Plex Mono', monospace; font-weight: 500; font-size: 13px; color: #fff;
  }
  .app-title { font-size: 16px; font-weight: 600; color: #fff; }
  .app-sub   { font-size: 11px; color: rgba(255,255,255,0.5); }
  .header-nav { display: flex; align-items: center; gap: 8px; }
  .btn-nav {
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15);
    color: #fff; border-radius: 7px; padding: 7px 14px; font-size: 13px;
    font-family: inherit; cursor: pointer; transition: background 0.15s;
  }
  .btn-nav:hover { background: rgba(255,255,255,0.2); }
  .month-label { font-size: 15px; font-weight: 600; color: #fff; min-width: 160px; text-align: center; }
  .btn-add {
    background: var(--today-ring); border: none; color: #fff; border-radius: 7px;
    padding: 7px 16px; font-size: 13px; font-family: inherit; font-weight: 600;
    cursor: pointer; display: flex; align-items: center; gap: 6px;
    transition: opacity 0.15s; margin-left: 8px;
  }
  .btn-add:hover { opacity: 0.88; }

  /* ── CALENDAR ── */
  .cal-wrap { max-width: 1280px; margin: 0 auto; padding: 24px 20px 40px; }
  .cal-dow { display: grid; grid-template-columns: repeat(7,1fr); gap: 6px; margin-bottom: 6px; }
  .dow-cell {
    text-align: center; font-size: 11px; font-weight: 600;
    letter-spacing: 0.8px; text-transform: uppercase; color: var(--text-muted); padding: 6px 0;
  }
  .dow-cell:first-child { color: #c0392b; }
  .dow-cell:last-child  { color: #2980b9; }
  .cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 6px; }

  .day-cell {
    background: var(--white); border: 1.5px solid var(--border);
    border-radius: 10px; min-height: 130px; padding: 8px 8px 6px;
    position: relative; transition: border-color 0.15s, background 0.15s;
  }
  .day-cell:hover { border-color: var(--steel); }
  .day-cell.other-month { background: #f3f5fa; border-color: #e0e6f0; }
  .day-cell.today { border: 2px solid var(--today-ring); box-shadow: 0 0 0 3px rgba(245,166,35,0.15); }
  .day-cell.drag-over { background: #e8f0ff !important; border-color: var(--steel) !important; box-shadow: 0 0 0 3px rgba(61,90,153,0.2); }

  .day-num {
    font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 5px;
    font-family: 'IBM Plex Mono', monospace; display: flex; align-items: center; justify-content: space-between;
  }
  .today .day-num .num-badge {
    background: var(--today-ring); color: #fff; border-radius: 50%;
    width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; font-size: 11px;
  }
  .other-month .day-num { color: #bfc8de; }
  .day-add-btn {
    background: none; border: none; color: var(--ice-dark); cursor: pointer;
    font-size: 16px; line-height: 1; padding: 0 2px; display: none; transition: color 0.15s;
  }
  .day-cell:hover .day-add-btn { display: block; color: var(--steel); }

  .day-clear-btn {
    background: none; border: none; color: var(--ice-dark); cursor: pointer;
    font-size: 12px; line-height: 1; padding: 0 2px; display: none;
    transition: color 0.15s; margin-left: 2px;
  }
  .day-cell:hover .day-clear-btn { display: block; color: #d0a0a0; }
  .day-clear-btn:hover { color: #c0392b !important; }

  /* ── SHIP CARD (real) ── */
  .ship-card {
    border-radius: 7px; padding: 6px 8px; margin-bottom: 5px;
    cursor: default; border-left: 4px solid #ccc;
    transition: transform 0.1s, box-shadow 0.1s, opacity 0.15s;
    background: #f5f5f5;
  }
  .ship-card:hover { transform: translateY(-1px); box-shadow: 0 3px 10px rgba(0,0,0,0.12); }
  .ship-card.dragging { opacity: 0.3; }

  /* ── COLOR SWATCH PICKER in form ── */
  .swatch-row {
    display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px;
  }
  .swatch {
    width: 28px; height: 28px; border-radius: 6px; cursor: pointer;
    border: 2.5px solid transparent;
    transition: transform 0.1s, border-color 0.1s;
    flex-shrink: 0;
  }
  .swatch:hover { transform: scale(1.15); }
  .swatch.selected { border-color: #1a2540; transform: scale(1.15); }

  /* ── PASTEL PALETTE (border = saturated, bg = light tint) ── */
  /* stored as hex on shipment.color, applied inline in makeCard */

  /* per-field drag handles */
  .drag-handle {
    display: inline-flex; align-items: center; gap: 3px;
    font-size: 8px; font-weight: 700; font-family: 'IBM Plex Mono', monospace;
    border-radius: 3px; padding: 1px 5px; cursor: grab;
    border: 1px solid transparent; transition: opacity 0.15s, box-shadow 0.1s;
    user-select: none;
  }
  .drag-handle:hover { box-shadow: 0 1px 4px rgba(0,0,0,0.18); opacity: 1 !important; }
  .drag-handle:active { cursor: grabbing; }
  .drag-handle.cfd-handle { background: #fdecea; color: #c0392b; border-color: #f5b9b5; }
  .drag-handle.lod-handle { background: #e6eeff; color: #1a5cb5; border-color: #b0c4f8; }
  .ship-card.done .drag-handle { opacity: 0.4; }

  /* done state — strikethrough */
  .ship-card.done {
    opacity: 0.55;
    filter: grayscale(0.5);
  }
  .ship-card.done .card-inv,
  .ship-card.done .card-wk { text-decoration: line-through; color: #aaa; }
  .ship-card.done .card-dates { opacity: 0.5; }

  /* done checkbox on card */
  .card-done-wrap {
    display: flex; align-items: center; gap: 5px; margin-top: 4px;
  }
  .card-done-cb {
    width: 13px; height: 13px; border-radius: 3px;
    border: 1.5px solid #bbb; background: #fff;
    cursor: pointer; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s, border-color 0.15s;
  }
  .card-done-cb.checked { background: #0d7a4e; border-color: #0d7a4e; }
  .card-done-cb.checked::after { content: '✓'; font-size: 9px; color: #fff; font-weight: 700; }
  .card-done-label { font-size: 8px; color: #bbb; font-family: 'IBM Plex Mono', monospace; }
  .ship-card.done .card-done-label { color: #0d7a4e; }

  /* ── FOOTPRINT CARD ── */
  .footprint-card {
    border-radius: 7px; padding: 5px 8px; margin-bottom: 5px;
    border: 1.5px dashed #bbb;
    background: repeating-linear-gradient(
      -45deg, #f5f5f5, #f5f5f5 4px, #ececec 4px, #ececec 8px
    );
    opacity: 0.72;
    position: relative;
    cursor: default;
  }
  .footprint-card .fp-label {
    font-size: 9px; font-weight: 700; letter-spacing: 0.5px;
    color: #aaa; text-transform: uppercase; font-family: 'IBM Plex Mono', monospace;
    display: flex; align-items: center; gap: 4px; margin-bottom: 2px;
  }
  .footprint-card .fp-wk  { font-size: 9px; color: #b0b0b0; font-family: 'IBM Plex Mono', monospace; font-weight: 700; }
  .footprint-card .fp-inv { font-size: 10px; color: #aaa; font-family: 'IBM Plex Mono', monospace; text-decoration: line-through; }
  .footprint-card .fp-to  {
    font-size: 8px; color: #bbb; font-family: 'IBM Plex Mono', monospace;
    margin-top: 2px; display: flex; align-items: center; gap: 3px;
  }
  /* dismiss x button */
  .footprint-card .fp-dismiss {
    position: absolute; top: 3px; right: 4px;
    background: none; border: none; color: #ccc; cursor: pointer; font-size: 11px;
    line-height: 1; padding: 0;
  }
  .footprint-card .fp-dismiss:hover { color: #999; }

  /* ── BADGES ── */
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 4px; }
  .card-wk  { font-size: 9px; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase; color: var(--text-muted); font-family: 'IBM Plex Mono', monospace; }
  .card-inv { font-size: 10px; font-weight: 600; color: var(--text); font-family: 'IBM Plex Mono', monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 80px; }
  .cnt-badge { font-size: 9px; font-weight: 700; border-radius: 4px; padding: 1px 5px; white-space: nowrap; flex-shrink: 0; }
  .cnt-add   { background: var(--cnt-add-bg);   color: var(--cnt-add); }
  .cnt-cut   { background: var(--cnt-cut-bg);   color: var(--cnt-cut); }
  .cnt-delay { background: var(--cnt-delay-bg); color: var(--cnt-delay); }
  .cnt-none  { background: var(--ice-dark);     color: var(--text-muted); }
  .lb-badge  { font-size: 8px; font-weight: 700; border-radius: 3px; padding: 1px 4px; margin-top: 3px; display: inline-block; }
  .lb-printed { background: var(--lb-printed-bg); color: var(--lb-printed); }
  .lb-notyet  { background: var(--lb-notyet-bg);  color: var(--lb-notyet); }
  .card-dates { margin-top: 4px; display: flex; gap: 6px; flex-wrap: wrap; }
  .date-chip  { font-size: 9px; font-family: 'IBM Plex Mono', monospace; color: var(--text-muted); display: flex; align-items: center; gap: 2px; }
  .date-chip span.label { font-weight: 700; text-transform: uppercase; color: var(--text); }

  /* ghost while dragging */
  #dragGhost {
    position: fixed; pointer-events: none; z-index: 9998;
    opacity: 0.88; transform: rotate(2deg) scale(1.04);
    box-shadow: 0 8px 24px rgba(0,0,0,0.22); border-radius: 7px; min-width: 120px; display: none;
  }

  /* ── LEGEND ── */
  .legend-bar {
    background: var(--white); border: 1.5px solid var(--border); border-radius: 10px;
    padding: 10px 16px; margin-bottom: 16px;
    display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center;
  }
  .legend-title { font-size: 10px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.6px; }
  .legend-item  { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text); }
  .leg-dot { width: 10px; height: 10px; border-radius: 2px; }
  .leg-fp  { width: 10px; height: 10px; border-radius: 2px; border: 1.5px dashed #bbb; background: #eee; }
  .legend-sep { color: var(--border); margin: 0 2px; }
  .legend-tip { margin-left: auto; font-size: 11px; color: var(--text-muted); }

  /* ── MODAL ── */
  .modal-bg { display: none; position: fixed; inset: 0; background: rgba(10,20,50,0.55); z-index: 200; align-items: center; justify-content: center; padding: 20px; }
  .modal-bg.open { display: flex; }
  .modal { background: #fff; border-radius: 16px; width: 100%; max-width: 520px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); overflow: hidden; }
  .modal-header { background: var(--navy); padding: 18px 24px; display: flex; align-items: center; justify-content: space-between; }
  .modal-title { font-size: 15px; font-weight: 600; color: #fff; }
  .modal-close { background: rgba(255,255,255,0.15); border: none; border-radius: 50%; width: 28px; height: 28px; color: #fff; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.15s; }
  .modal-close:hover { background: rgba(255,255,255,0.3); }
  .modal-body { padding: 22px 24px; max-height: 70vh; overflow-y: auto; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
  .form-row.full { grid-template-columns: 1fr; }
  .form-group { display: flex; flex-direction: column; gap: 5px; }
  .form-label { font-size: 11px; font-weight: 600; color: var(--text-muted); letter-spacing: 0.5px; text-transform: uppercase; }
  .form-input, .form-select { border: 1.5px solid var(--border); border-radius: 8px; padding: 9px 12px; font-size: 13px; font-family: inherit; color: var(--text); outline: none; transition: border-color 0.15s; background: #fff; width: 100%; }
  .form-input:focus, .form-select:focus { border-color: var(--steel); box-shadow: 0 0 0 3px rgba(61,90,153,0.12); }
  .section-divider { border: none; border-top: 1.5px dashed var(--border); margin: 16px 0; }
  .modal-footer { padding: 14px 24px 20px; display: flex; gap: 10px; justify-content: flex-end; }
  .btn-cancel { background: var(--ice); border: 1.5px solid var(--border); color: var(--text-muted); border-radius: 8px; padding: 9px 20px; font-size: 13px; font-family: inherit; cursor: pointer; transition: background 0.15s; }
  .btn-cancel:hover { background: var(--ice-dark); }
  .btn-save { background: var(--navy); border: none; color: #fff; border-radius: 8px; padding: 9px 22px; font-size: 13px; font-family: inherit; font-weight: 600; cursor: pointer; transition: background 0.15s; }
  .btn-save:hover { background: var(--navy-light); }
  .btn-delete { background: #fdecea; border: 1.5px solid #f5b9b5; color: #c0392b; border-radius: 8px; padding: 9px 16px; font-size: 13px; font-family: inherit; cursor: pointer; margin-right: auto; transition: background 0.15s; }
  .btn-delete:hover { background: #fbd0cc; }

  /* ── DETAIL ── */
  .detail-modal .modal-body { padding: 0; }
  .detail-section { padding: 14px 22px; border-bottom: 1px solid var(--border); }
  .detail-section:last-child { border-bottom: none; }
  .detail-grid { display: grid; grid-template-columns: 120px 1fr; gap: 8px 12px; }
  .detail-key { color: var(--text-muted); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; padding-top: 2px; }
  .detail-val { font-weight: 500; color: var(--text); font-family: 'IBM Plex Mono', monospace; font-size: 12px; }
  .badge-inline { display: inline-flex; align-items: center; border-radius: 5px; padding: 2px 8px; font-size: 11px; font-weight: 700; font-family: 'IBM Plex Sans Thai', sans-serif; }
  .detail-actions { padding: 14px 22px; display: flex; gap: 10px; justify-content: flex-end; }
  .btn-edit { background: var(--navy); border: none; color: #fff; border-radius: 8px; padding: 8px 20px; font-size: 13px; font-family: inherit; font-weight: 600; cursor: pointer; }

  /* ── LANG SWITCHER ── */
  .lang-switcher { display: flex; gap: 4px; margin-left: 12px; }
  .btn-lang {
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
    color: rgba(255,255,255,0.7); border-radius: 6px; padding: 5px 10px;
    font-size: 11px; font-weight: 600; font-family: inherit; cursor: pointer;
    transition: all 0.15s; letter-spacing: 0.3px;
  }
  .btn-lang:hover { background: rgba(255,255,255,0.2); color: #fff; }
  .btn-lang.active { background: var(--today-ring); border-color: var(--today-ring); color: #fff; }

  /* ── TOAST ── */
  #dragToast {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
    background: var(--navy); color: #fff; padding: 10px 22px;
    border-radius: 30px; font-size: 13px; font-weight: 500;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    opacity: 0; transition: opacity 0.2s; z-index: 9999; pointer-events: none; white-space: nowrap;
  }
  #dragToast.show { opacity: 1; }

  /* ── FIREBASE SETUP SCREEN ── */
  #setupScreen {
    display: none; position: fixed; inset: 0;
    background: var(--navy); z-index: 5000;
    align-items: center; justify-content: center; padding: 24px;
  }
  #setupScreen.show { display: flex; }
  .setup-box {
    background: #fff; border-radius: 18px; width: 100%; max-width: 520px;
    padding: 36px 32px; box-shadow: 0 24px 60px rgba(0,0,0,0.4);
  }
  .setup-logo { font-family:'IBM Plex Mono',monospace; font-size:28px; font-weight:700; color:var(--navy); margin-bottom:6px; }
  .setup-sub  { font-size:13px; color:var(--text-muted); margin-bottom:28px; line-height:1.5; }
  .setup-step { display:flex; align-items:flex-start; gap:12px; margin-bottom:14px; font-size:13px; color:var(--text); line-height:1.6; }
  .setup-num  { background:var(--steel); color:#fff; border-radius:50%; width:22px; height:22px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; margin-top:2px; }
  .setup-step a { color:var(--steel); }
  .setup-divider { border:none; border-top:1.5px dashed var(--border); margin:20px 0; }
  .setup-label { font-size:11px; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:6px; }
  .setup-input {
    width:100%; border:1.5px solid var(--border); border-radius:8px;
    padding:10px 12px; font-size:12px; font-family:'IBM Plex Mono',monospace;
    outline:none; color:var(--text); margin-bottom:10px;
  }
  .setup-input:focus { border-color:var(--steel); box-shadow:0 0 0 3px rgba(61,90,153,0.12); }
  .setup-btn {
    width:100%; background:var(--navy); color:#fff; border:none;
    border-radius:10px; padding:13px; font-size:14px; font-weight:700;
    font-family:inherit; cursor:pointer; margin-top:6px; transition:background 0.15s;
  }
  .setup-btn:hover { background:var(--navy-light); }
  .setup-err { color:#c0392b; font-size:12px; margin-top:-6px; margin-bottom:8px; display:none; }

  /* sync indicator */
  #syncDot {
    width:8px; height:8px; border-radius:50%; background:#aaa;
    display:inline-block; margin-right:6px; vertical-align:middle;
    transition:background 0.3s;
  }
  #syncDot.ok     { background:#22c55e; }
  #syncDot.syncing{ background:#f59e0b; animation:pulse 0.8s infinite; }
  #syncDot.err    { background:#ef4444; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  #syncStatus { font-size:10px; color:rgba(255,255,255,0.5); vertical-align:middle; }

  @media (max-width: 768px) {
    .day-cell { min-height: 70px; padding: 5px; }
    .ship-card { padding: 4px 5px; }
    .card-dates { display: none; }
    header { padding: 0 14px; }
    .app-sub { display: none; }
    .form-row { grid-template-columns: 1fr; }
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>
</head>
<body>

<header>
  <div class="header-left">
    <div class="logo-mark">SHP</div>
    <div>
      <div class="app-title" id="hTitle">Shipment Calendar</div>
      <div class="app-sub" id="hSub">Export Schedule Tracker</div>
    </div>
  </div>
  <div class="header-nav">
    <button class="btn-nav" id="prevBtn">&#8592;</button>
    <span class="month-label" id="monthLabel"></span>
    <button class="btn-nav" id="nextBtn">&#8594;</button>
    <button class="btn-nav" id="todayBtn">-</button>
    <div class="lang-switcher">
      <button class="btn-lang active" data-lang="th">ไทย</button>
      <button class="btn-lang" data-lang="zh">中文</button>
      <button class="btn-lang" data-lang="en">EN</button>
      <button class="btn-lang" id="wkToggleBtn" title="Toggle week number">WK</button>
    </div>
    <div style="display:flex;align-items:center;margin-left:12px">
      <span id="syncDot"></span><span id="syncStatus" style="font-size:10px;color:rgba(255,255,255,0.5)"></span>
    </div>
  </div>
</header>

<div id="dragGhost"></div>
<div id="dragToast"></div>

<div class="cal-wrap">
  <div class="legend-bar" id="legendBar"></div>

  <div class="cal-dow" id="calDow"></div>

  <div class="cal-grid" id="calGrid"></div>
</div>

<!-- ADD/EDIT MODAL -->
<div class="modal-bg" id="formModal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="formTitle">เพิ่ม Shipment ใหม่</span>
      <button class="modal-close" id="formClose">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-row">

<script>
// ─── INFOGRAPHIC MODAL ──────────────────────────────────────────────
function openInfographic(shipId) {
  const s = shipments.find(x => x.id === shipId);
  const data = s && s._infographic;
  const body = document.getElementById('infoBody');
  if (!data || !data.length) {
    body.innerHTML = `<div style="padding:20px;text-align:center;color:#9ca3af;font-size:13px">${t('infoNoData')}</div>`;
  } else {
    body.innerHTML = `<div style="display:flex;gap:8px;margin-bottom:10px">
        <button onclick="printInfographic('${s.id}')" style="flex:1;padding:8px;border-radius:6px;border:1px solid #1e3a8a;background:#1e3a8a;color:#fff;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit">🖨️ ${t('infoPrint')}</button>
        <button onclick="exportInfographicWord('${s.id}')" style="flex:1;padding:8px;border-radius:6px;border:1px solid #2563eb;background:#fff;color:#2563eb;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit">📄 ${t('infoWord')}</button>
      </div>` +
      data.map(ctn => {
      const items = ctn.items || [];
      const plts = [];
      items.forEach(it => { for (let n=0; n<it.plt; n++) plts.push(it.partId); });
      return `<div style="border:1px solid #e2e8f0;border-radius:10px;padding:12px;margin-bottom:12px;background:#fff">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
          <div style="width:22px;height:22px;border-radius:6px;background:#1e3a8a;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center">${ctn.ctnNo}</div>
          <div>
            <div style="font-size:12px;font-weight:600;color:#1a2540">${ctn.ctnType}</div>
            <div style="font-size:10px;color:#5a6a8a;font-family:'IBM Plex Mono',monospace">${ctn.totalPlt} PLT</div>
          </div>
        </div>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:4px;margin-bottom:8px">
          ${plts.map(pid => `<div style="font-size:8px;text-align:center;padding:4px 2px;border-radius:4px;background:#fdf2f8;border:1px solid #f9a8d4;color:#9d174d;font-family:'IBM Plex Mono',monospace;white-space:nowrap;overflow:hidden">${pid.slice(-4)}</div>`).join('')}
        </div>
        <div style="font-size:11px;line-height:1.7">
          ${items.map(it => `<div style="display:flex;justify-content:space-between"><span style="font-weight:600;color:#9d174d">${it.partId}</span><span style="font-family:'IBM Plex Mono',monospace;color:#5a6a8a">${(it.pcs||0).toLocaleString()} PCS · ${it.plt} PLT · ${it.kg.toLocaleString()} kg · ${it.cbm} CBM</span></div>`).join('')}
          <div style="display:flex;justify-content:space-between;margin-top:4px;padding-top:4px;border-top:1px solid #e2e8f0">
            <span style="font-weight:700">${t('infoTotal')}</span>
            <span style="font-family:'IBM Plex Mono',monospace;font-weight:700">${ctn.totalPlt} PLT · ${ctn.totalKg.toLocaleString()} kg · ${ctn.totalCbm} CBM</span>
          </div>
          ${ctn.vgm ? `<div style="display:flex;justify-content:space-between;color:#856404"><span>VGM</span><span style="font-family:'IBM Plex Mono',monospace">${ctn.vgm.toLocaleString()} kg</span></div>` : ''}
        </div>
      </div>`;
    }).join('');
  }
  document.getElementById('infoModal').classList.add('open');
}
function closeInfographic() { document.getElementById('infoModal').classList.remove('open'); }

// ─── PRINT INFOGRAPHIC ──────────────────────────────────────────────
function printInfographic(shipId) {
  const s = shipments.find(x => x.id === shipId);
  const data = (s && s._infographic) || [];
  const win = window.open('', '_blank');
  const title = `${t('infoModalTitle')} — ${s.inv || ''}`;
  const PALETTE = ["#FDF2F8","#F0FDF4","#EFF6FF","#FEF9E7","#F3E8FF","#FFF1F0","#ECFEFF","#FFFBEB"];
  const BORDER_COLORS = ["#F9A8D4","#86EFAC","#93C5FD","#FCD34D","#C4B5FD","#FCA5A5","#67E8F9","#FBBF24"];
  const partColorMap = {};
  let _colorIdx = 0;
  function colorForPart(partId) {
    if (!(partId in partColorMap)) { partColorMap[partId] = _colorIdx % PALETTE.length; _colorIdx++; }
    return partColorMap[partId];
  }

  const sections = data.map((ctn, ci) => {
    const items = ctn.items || [];
    const meta = (s._ctnMeta && s._ctnMeta[ci]) || {};
    const pltList = [];
    items.forEach(it => { for (let n=0; n<it.plt; n++) pltList.push(it.partId); });
    const pltGrid = pltList.map(pid => {
      const colorIdx = colorForPart(pid);
      return `<div style="border:1.5px solid ${BORDER_COLORS[colorIdx]};background:${PALETTE[colorIdx]};border-radius:4px;padding:4px 2px;text-align:center">
        <input type="checkbox" style="width:13px;height:13px;display:block;margin:0 auto 2px">
        <div style="font-size:9px;font-weight:700;font-family:'IBM Plex Mono',monospace">${pid.slice(-4)}</div>
      </div>`;
    }).join('');
    const legend = Object.keys(partColorMap).filter(pid => items.some(it=>it.partId===pid)).map(pid =>
      `<span style="display:inline-flex;align-items:center;gap:4px;margin-right:14px;font-size:11px"><span style="display:inline-block;width:11px;height:11px;border-radius:2px;background:${PALETTE[partColorMap[pid]]};border:1.5px solid ${BORDER_COLORS[partColorMap[pid]]}"></span>${pid}</span>`
    ).join('');
    return `<div style="border:1px solid #ccc;border-radius:8px;padding:14px;margin-bottom:14px;page-break-inside:avoid">
      <h3 style="margin:0 0 8px;font-size:14px">#${ctn.ctnNo} ${ctn.ctnType} — ${ctn.totalPlt} PLT</h3>
      <div style="display:flex;gap:24px;font-size:12px;margin-bottom:8px">
        <div style="flex:1">${t('ctnNoLabel')}: <span style="display:inline-block;border-bottom:1px solid #999;min-width:160px">${meta.ctnNo || '&nbsp;'}</span></div>
        <div style="flex:1">${t('sealNoLabel')}: <span style="display:inline-block;border-bottom:1px solid #999;min-width:160px">${meta.seal || '&nbsp;'}</span></div>
      </div>
      ${pltGrid ? `<div style="display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin-bottom:8px">${pltGrid}</div>
      <div style="margin-bottom:10px">${legend}</div>` : ''}
      <table style="width:100%;border-collapse:collapse;font-size:12px">
        <thead><tr style="background:#f3f4f6;text-align:left">
          <th style="border:1px solid #ddd;padding:5px;width:24px"></th>
          <th style="border:1px solid #ddd;padding:5px">${t('infoPart')}</th>
          <th style="border:1px solid #ddd;padding:5px;text-align:right">PCS</th>
          <th style="border:1px solid #ddd;padding:5px;text-align:right">PLT</th>
          <th style="border:1px solid #ddd;padding:5px;text-align:right">kg</th>
          <th style="border:1px solid #ddd;padding:5px;text-align:right">CBM</th>
        </tr></thead>
        <tbody>
          ${items.map(it => `<tr>
            <td style="border:1px solid #ddd;padding:5px;text-align:center"><input type="checkbox" style="width:14px;height:14px"></td>
            <td style="border:1px solid #ddd;padding:5px;font-weight:600">${it.partId}</td>
            <td style="border:1px solid #ddd;padding:5px;text-align:right">${(it.pcs||0).toLocaleString()}</td>
            <td style="border:1px solid #ddd;padding:5px;text-align:right">${it.plt}</td>
            <td style="border:1px solid #ddd;padding:5px;text-align:right">${it.kg.toLocaleString()}</td>
            <td style="border:1px solid #ddd;padding:5px;text-align:right">${it.cbm}</td>
          </tr>`).join('')}
          <tr style="font-weight:700;background:#f9fafb">
            <td style="border:1px solid #ddd;padding:5px"></td>
            <td style="border:1px solid #ddd;padding:5px">${t('infoTotal')}</td>
            <td style="border:1px solid #ddd;padding:5px;text-align:right">${items.reduce((a,it)=>a+(it.pcs||0),0).toLocaleString()}</td>
            <td style="border:1px solid #ddd;padding:5px;text-align:right">${ctn.totalPlt}</td>
            <td style="border:1px solid #ddd;padding:5px;text-align:right">${ctn.totalKg.toLocaleString()}</td>
            <td style="border:1px solid #ddd;padding:5px;text-align:right">${ctn.totalCbm}</td>
          </tr>
          ${ctn.vgm ? `<tr><td colspan="5" style="border:1px solid #ddd;padding:5px;text-align:right;color:#856404">VGM</td><td style="border:1px solid #ddd;padding:5px;text-align:right;color:#856404">${ctn.vgm.toLocaleString()} kg</td></tr>` : ''}
        </tbody>
      </table>
      <div style="margin-top:10px;font-size:12px;display:flex;gap:24px">
        <label style="display:flex;align-items:center;gap:6px"><input type="checkbox" style="width:14px;height:14px" ${meta.ready==='ready'?'checked':''}> ${t('readyYes')}</label>
        <label style="display:flex;align-items:center;gap:6px"><input type="checkbox" style="width:14px;height:14px" ${meta.ready==='notready'?'checked':''}> ${t('readyNo')}</label>
      </div>
    </div>`;
  }).join('');

  win.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><title>${title}</title>
    <style>body{font-family:Arial,sans-serif;padding:24px;color:#1a2540} h1{font-size:18px}
    input[type=checkbox]{ -webkit-print-color-adjust: exact; print-color-adjust: exact; accent-color:#1e3a8a; }
    @media print { input[type=checkbox] { transform: scale(1.2); } }
    </style>
    </head><body>
    <h1>${title}</h1>
    <div style="font-size:12px;color:#5a6a8a;margin-bottom:16px">
      ${s.cntLabel ? `${t('calcCtn')}: ${s.cntLabel}<br>` : ''}
      ${s.customers ? `${t('calcCust')}: ${s.customers}<br>` : ''}
      ${s.totalGW ? `${t('calcGW')}: ${s.totalGW} kg<br>` : ''}
      ${s.totalCBM ? `${t('calcCBM')}: ${s.totalCBM} CBM` : ''}
    </div>
    ${sections}
    </body></html>`);
  win.document.close();
  win.onload = () => { win.focus(); win.print(); };
}

// ─── EXPORT INFOGRAPHIC AS WORD (.docx) ────────────────────────────
async function exportInfographicWord(shipId) {
  const s = shipments.find(x => x.id === shipId);
  const data = (s && s._infographic) || [];
  if (!window.docx) { alert('Word export library failed to load'); return; }
  const { Document, Packer, Paragraph, TextRun, Table, TableRow, TableCell,
          HeadingLevel, BorderStyle, WidthType, ShadingType, AlignmentType } = window.docx;

  const border = { style: BorderStyle.SINGLE, size: 1, color: "CCCCCC" };
  const borders = { top: border, bottom: border, left: border, right: border };
  const colWidths = [3120, 1560, 1560, 1560, 1560];

  // Light pastel fills (print-friendly, low ink) cycling per part code
  const PALETTE = ["FDF2F8","F0FDF4","EFF6FF","FEF9E7","F3E8FF","FFF1F0","ECFEFF","FFFBEB"];
  const BORDER_COLORS = ["F9A8D4","86EFAC","93C5FD","FCD34D","C4B5FD","FCA5A5","67E8F9","FBBF24"];
  const partColorMap = {};
  let _colorIdx = 0;
  function colorForPart(partId) {
    if (!partColorMap[partId]) {
      partColorMap[partId] = _colorIdx % PALETTE.length;
      _colorIdx++;
    }
    return partColorMap[partId];
  }
  const headerCell = (text) => new TableCell({
    borders, width: { size: colWidths[0], type: WidthType.DXA },
    shading: { fill: "F3F4F6", type: ShadingType.CLEAR },
    margins: { top: 60, bottom: 60, left: 100, right: 100 },
    children: [new Paragraph({ children: [new TextRun({ text, bold: true })] })],
  });
  const cell = (text, width, opts={}) => new TableCell({
    borders, width: { size: width, type: WidthType.DXA },
    margins: { top: 60, bottom: 60, left: 100, right: 100 },
    children: [new Paragraph({ alignment: opts.right ? AlignmentType.RIGHT : AlignmentType.LEFT,
      children: [new TextRun({ text: String(text), bold: !!opts.bold })] })],
  });

  const children = [
    new Paragraph({ heading: HeadingLevel.HEADING_1, children: [new TextRun(`${t('infoModalTitle')} — ${s.inv || ''}`)] }),
  ];

  const meta = [];
  if (s.cntLabel)  meta.push(`${t('calcCtn')}: ${s.cntLabel}`);
  if (s.customers) meta.push(`${t('calcCust')}: ${s.customers}`);
  if (s.totalGW)   meta.push(`${t('calcGW')}: ${s.totalGW} kg`);
  if (s.totalCBM)  meta.push(`${t('calcCBM')}: ${s.totalCBM} CBM`);
  meta.forEach(m => children.push(new Paragraph({ children: [new TextRun(m)] })));

  data.forEach((ctn, ci) => {
    const items = ctn.items || [];
    const ctnMeta = (s._ctnMeta && s._ctnMeta[ci]) || {};
    children.push(new Paragraph({ heading: HeadingLevel.HEADING_2,
      children: [new TextRun(`#${ctn.ctnNo} ${ctn.ctnType} — ${ctn.totalPlt} PLT`)] }));
    children.push(new Paragraph({ children: [
      new TextRun(`${t('ctnNoLabel')}: ${ctnMeta.ctnNo || '__________________'}    `),
      new TextRun(`${t('sealNoLabel')}: ${ctnMeta.seal || '__________________'}`),
    ]}));

    // ── Pallet grid (one checkable box per pallet, color-coded by part) ──
    const pltList = [];
    items.forEach(it => { for (let n=0; n<it.plt; n++) pltList.push(it.partId); });
    if (pltList.length) {
      const PALLET_COLS = 12;
      const pltCellW = Math.floor((checkColWidth + colWidths.reduce((a,b)=>a+b,0)) / PALLET_COLS);
      const pltRows = [];
      for (let r = 0; r < Math.ceil(pltList.length / PALLET_COLS); r++) {
        const rowCells = [];
        for (let c = 0; c < PALLET_COLS; c++) {
          const idx = r * PALLET_COLS + c;
          if (idx < pltList.length) {
            const partId = pltList[idx];
            const colorIdx = colorForPart(partId);
            rowCells.push(new TableCell({
              borders: { top:{style:BorderStyle.SINGLE,size:2,color:BORDER_COLORS[colorIdx]}, bottom:{style:BorderStyle.SINGLE,size:2,color:BORDER_COLORS[colorIdx]}, left:{style:BorderStyle.SINGLE,size:2,color:BORDER_COLORS[colorIdx]}, right:{style:BorderStyle.SINGLE,size:2,color:BORDER_COLORS[colorIdx]} },
              width: { size: pltCellW, type: WidthType.DXA },
              shading: { fill: PALETTE[colorIdx], type: ShadingType.CLEAR },
              margins: { top: 100, bottom: 80, left: 40, right: 40 },
              children: [
                new Paragraph({ alignment: AlignmentType.CENTER, children: [new TextRun({ text: '☐', size: 28 })] }),
                new Paragraph({ alignment: AlignmentType.CENTER, children: [new TextRun({ text: partId.slice(-4), size: 14, bold: true })] }),
              ],
            }));
          } else {
            rowCells.push(new TableCell({
              borders: { top:{style:BorderStyle.NONE}, bottom:{style:BorderStyle.NONE}, left:{style:BorderStyle.NONE}, right:{style:BorderStyle.NONE} },
              width: { size: pltCellW, type: WidthType.DXA },
              children: [new Paragraph({ text: '' })],
            }));
          }
        }
        pltRows.push(new TableRow({ children: rowCells }));
      }
      children.push(new Table({
        width: { size: pltCellW * PALLET_COLS, type: WidthType.DXA },
        columnWidths: Array(PALLET_COLS).fill(pltCellW),
        rows: pltRows,
      }));
      children.push(new Paragraph({ spacing: { after: 120 }, text: '' }));

      // Legend: color → part code
      const legendRuns = [];
      Object.keys(partColorMap).filter(pid => items.some(it=>it.partId===pid)).forEach((pid, i) => {
        if (i > 0) legendRuns.push(new TextRun('   '));
        legendRuns.push(new TextRun({ text: '■ ', color: BORDER_COLORS[partColorMap[pid]] }));
        legendRuns.push(new TextRun({ text: pid, size: 18 }));
      });
      if (legendRuns.length) children.push(new Paragraph({ children: legendRuns, spacing: { after: 120 } }));
    }

    const checkColWidth = 360;
    const rows = [
      new TableRow({ children: [
        new TableCell({ borders, width:{size:checkColWidth,type:WidthType.DXA}, shading:{fill:"F3F4F6",type:ShadingType.CLEAR}, margins:{top:60,bottom:60,left:100,right:100}, children:[new Paragraph({text:''})] }),
        headerCell(t('infoPart')),
        new TableCell({ borders, width:{size:colWidths[1],type:WidthType.DXA}, shading:{fill:"F3F4F6",type:ShadingType.CLEAR}, margins:{top:60,bottom:60,left:100,right:100}, children:[new Paragraph({alignment:AlignmentType.RIGHT, children:[new TextRun({text:'PCS',bold:true})]})] }),
        new TableCell({ borders, width:{size:colWidths[2],type:WidthType.DXA}, shading:{fill:"F3F4F6",type:ShadingType.CLEAR}, margins:{top:60,bottom:60,left:100,right:100}, children:[new Paragraph({alignment:AlignmentType.RIGHT, children:[new TextRun({text:'PLT',bold:true})]})] }),
        new TableCell({ borders, width:{size:colWidths[3],type:WidthType.DXA}, shading:{fill:"F3F4F6",type:ShadingType.CLEAR}, margins:{top:60,bottom:60,left:100,right:100}, children:[new Paragraph({alignment:AlignmentType.RIGHT, children:[new TextRun({text:'kg',bold:true})]})] }),
        new TableCell({ borders, width:{size:colWidths[4],type:WidthType.DXA}, shading:{fill:"F3F4F6",type:ShadingType.CLEAR}, margins:{top:60,bottom:60,left:100,right:100}, children:[new Paragraph({alignment:AlignmentType.RIGHT, children:[new TextRun({text:'CBM',bold:true})]})] }),
      ]}),
      ...items.map(it => new TableRow({ children: [
        new TableCell({ borders, width:{size:checkColWidth,type:WidthType.DXA}, margins:{top:60,bottom:60,left:100,right:100}, children:[new Paragraph({alignment:AlignmentType.CENTER, children:[new TextRun('☐')]})] }),
        cell(it.partId, colWidths[0], {bold:true}),
        cell((it.pcs||0).toLocaleString(), colWidths[1], {right:true}),
        cell(it.plt, colWidths[2], {right:true}),
        cell(it.kg.toLocaleString(), colWidths[3], {right:true}),
        cell(it.cbm, colWidths[4], {right:true}),
      ]})),
      new TableRow({ children: [
        new TableCell({ borders, width:{size:checkColWidth,type:WidthType.DXA}, margins:{top:60,bottom:60,left:100,right:100}, children:[new Paragraph({text:''})] }),
        cell(t('infoTotal'), colWidths[0], {bold:true}),
        cell(items.reduce((a,it)=>a+(it.pcs||0),0).toLocaleString(), colWidths[1], {right:true,bold:true}),
        cell(ctn.totalPlt, colWidths[2], {right:true,bold:true}),
        cell(ctn.totalKg.toLocaleString(), colWidths[3], {right:true,bold:true}),
        cell(ctn.totalCbm, colWidths[4], {right:true,bold:true}),
      ]}),
    ];

    children.push(new Table({
      width: { size: checkColWidth + colWidths.reduce((a,b)=>a+b,0), type: WidthType.DXA },
      columnWidths: [checkColWidth, ...colWidths],
      rows,
    }));
    if (ctn.vgm) {
      children.push(new Paragraph({ children: [new TextRun(`VGM: ${ctn.vgm.toLocaleString()} kg`)], spacing: { before: 80, after: 80 } }));
    }
    children.push(new Paragraph({ spacing: { before: 40, after: 160 }, children: [
      new TextRun(`${ctnMeta.ready==='ready'?'☑':'☐'} ${t('readyYes')}    `),
      new TextRun(`${ctnMeta.ready==='notready'?'☑':'☐'} ${t('readyNo')}`),
    ]}));
  });

  const doc = new Document({
    styles: { default: { document: { run: { font: "Arial", size: 22 } } } },
    sections: [{
      properties: { page: { size: { width: 12240, height: 15840 }, margin: { top: 1440, right: 1440, bottom: 1440, left: 1440 } } },
      children,
    }],
  });

  const blob = await Packer.toBlob(doc);
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `infographic_${(s.inv||s.id).replace(/[^a-z0-9_-]/gi,'_')}.docx`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ISO 8601 week number
function isoWeek(y, m, d) {
  const date = new Date(Date.UTC(y, m, d));
  const dayNum = (date.getUTCDay() + 6) % 7; // Mon=0..Sun=6
  date.setUTCDate(date.getUTCDate() - dayNum + 3); // nearest Thursday
  const firstThursday = new Date(Date.UTC(date.getUTCFullYear(), 0, 4));
  const diff = date - firstThursday;
  return 1 + Math.round(diff / (7 * 24 * 3600 * 1000));
}

// ─── CARRIER MANAGEMENT ─────────────────────────────────────────────
// Maersk and ZIM have permanently fixed colors (not user-editable) for visual consistency.
const LOCKED_CARRIER_COLORS = { maersk: '#80DFFF', zim: '#001A70' };
const DEFAULT_CARRIERS = [
  { id:'maersk', name:'Maersk', url:'https://www.maersk.com/tracking/{BK}', color:LOCKED_CARRIER_COLORS.maersk },
  { id:'zim',    name:'ZIM',    url:'zim_special', color:LOCKED_CARRIER_COLORS.zim },
];
function loadCarriers() {
  let list;
  try { list = JSON.parse(localStorage.getItem(CARRIER_KEY)) || DEFAULT_CARRIERS; }
  catch { list = DEFAULT_CARRIERS; }
  // enforce locked colors even if older saved data has a different color
  list.forEach(c => { if (LOCKED_CARRIER_COLORS[c.id]) c.color = LOCKED_CARRIER_COLORS[c.id]; });
  return list;
}
function saveCarriers(list) { localStorage.setItem(CARRIER_KEY, JSON.stringify(list)); }
let carriers = loadCarriers();

// Fixed palette for custom carriers — each color may only be assigned to one carrier at a time
const CARRIER_PALETTE = [
  '#E11D48', '#EA580C', '#D97706', '#65A30D', '#16A34A', '#0D9488',
  '#0891B2', '#2563EB', '#4F46E5', '#7C3AED', '#C026D3', '#475569',
];
function usedCarrierColors(excludeId=null) {
  return new Set(carriers.filter(c => c.id !== excludeId && !LOCKED_CARRIER_COLORS[c.id]).map(c => c.color));
}
function renderColorSwatches(selected, excludeId=null) {
  const grid = document.getElementById('colorSwatchGrid');
  if (!grid) return;
  const used = usedCarrierColors(excludeId);
  grid.innerHTML = CARRIER_PALETTE.map(hex => {
    const isUsed = used.has(hex) && hex !== selected;
    const isSelected = hex === selected;
    return `<button type="button" ${isUsed ? 'disabled' : ''} onclick="pickCarrierColor('${hex}')"
      style="width:18px;height:18px;border-radius:5px;background:${hex};border:2px solid ${isSelected?'#1a2540':'transparent'};cursor:${isUsed?'not-allowed':'pointer'};opacity:${isUsed?'0.25':'1'};padding:0"
      title="${isUsed ? t('carrierColorTaken') : ''}"></button>`;
  }).join('');
}
function pickCarrierColor(hex) {
  document.getElementById('newCarrierColor').value = hex;
  renderColorSwatches(hex, _carrierEditingId);
}

function buildCarrierSelect(selectedId='') {
  // Render carrier picker as a list of clickable cards (clearer than a dropdown+pencil combo)
  document.getElementById('fCarrier').value = selectedId || '';

}

function renderCarrierCards(selectedId='') {
  const list = document.getElementById('carrierCardList');

    <span>${t('carrierNone')}</span>
  </div>`;
  carriers.forEach(c => {
    const sel = c.id === selectedId;
    html += `<div style="display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:7px;border:1.5px solid ${sel?c.color:'#e2e8f0'};background:${sel?c.color+'14':'#fff'};cursor:pointer">
      <span onclick="selectCarrier('${c.id}')" style="display:flex;align-items:center;gap:8px;flex:1;font-size:12px;color:var(--ink);font-weight:${sel?'700':'400'}">

        <span>🚢 ${c.name}</span>

let _carrierFormMode = 'add'; // 'add' | 'edit'
let _carrierEditingId = null;

function openAddCarrierForm() {
  _carrierFormMode = 'add';
  _carrierEditingId = null;
  document.getElementById('newCarrierName').value = '';
  document.getElementById('newCarrierUrl').value = '';
  document.getElementById('newCarrierUrl').style.display = 'block';
  // pick the first unused color in the palette by default
  const used = usedCarrierColors(null);
  const firstFree = CARRIER_PALETTE.find(c => !used.has(c)) || CARRIER_PALETTE[0];
  document.getElementById('newCarrierColor').value = firstFree;
  document.getElementById('colorPaletteWrap').style.display = 'block';
  document.getElementById('colorLockedNote').style.display = 'none';
  renderColorSwatches(firstFree, null);
  document.getElementById('carrierFormTitle').textContent = t('carrierFormTitle');
  document.getElementById('btnCarrierSave').textContent = t('carrierSave');
  document.getElementById('addCarrierForm').style.display = 'block';
}
function openEditCarrierForm(id) {
  const c = getCarrier(id);
  if (!c) return;
  _carrierFormMode = 'edit';
  _carrierEditingId = id;
  document.getElementById('newCarrierName').value = c.name;
  document.getElementById('newCarrierUrl').value = (c.url === 'zim_special') ? '' : c.url;
  document.getElementById('newCarrierUrl').style.display = (c.url === 'zim_special') ? 'none' : 'block';
  document.getElementById('newCarrierColor').value = c.color || '#374151';
  const locked = !!LOCKED_CARRIER_COLORS[c.id];
  document.getElementById('colorPaletteWrap').style.display = locked ? 'none' : 'block';
  document.getElementById('colorLockedNote').style.display = locked ? 'block' : 'none';
  document.getElementById('colorLockedNote').textContent = t('carrierColorLocked');
  if (!locked) renderColorSwatches(c.color, id);
  document.getElementById('carrierFormTitle').textContent = t('carrierFormTitleEdit');
  document.getElementById('btnCarrierSave').textContent = t('carrierSave');
  document.getElementById('addCarrierForm').style.display = 'block';
}
function closeAddCarrierForm() {
  document.getElementById('addCarrierForm').style.display = 'none';
  document.getElementById('newCarrierName').value = '';
  document.getElementById('newCarrierUrl').value = '';
  document.getElementById('newCarrierColor').value = '#374151';
}
function saveNewCarrier() {
  const name  = document.getElementById('newCarrierName').value.trim();
  const color = document.getElementById('newCarrierColor').value;
  const isZim = _carrierFormMode === 'edit' && _carrierEditingId === 'zim';
  const url   = isZim ? 'zim_special' : document.getElementById('newCarrierUrl').value.trim();
  if (!name) { alert(t('carrierAlertName')); return; }
  if (!isZim && !url) { alert(t('carrierAlertUrl')); return; }

  let newSelectedId;
  if (_carrierFormMode === 'edit' && _carrierEditingId) {
    const c = getCarrier(_carrierEditingId);
    if (c) {
      c.name = name;
      if (!LOCKED_CARRIER_COLORS[c.id]) c.color = color; // Maersk/ZIM colors are fixed
      if (!isZim) c.url = url;
    }
    saveCarriers(carriers);
    newSelectedId = document.getElementById('fCarrier').value; // keep current selection
  } else {
    const id = 'carrier_' + Date.now();
    carriers.push({ id, name, url, color });
    saveCarriers(carriers);
    newSelectedId = id; // auto-select the newly added carrier
  }
  renderCarrierCards(newSelectedId);
  document.getElementById('fCarrier').value = newSelectedId;
  closeAddCarrierForm();
}
function getCarrier(id) { return carriers.find(c => c.id === id) || null; }
function trackShipment(carrierId, bookingNo) {
  const c = getCarrier(carrierId);
  if (!c) return;
  if (c.id === 'zim' || c.url === 'zim_special') {
    openZimModal(bookingNo);
    return;
  }
  const url = c.url.replace('{BK}', encodeURIComponent(bookingNo));
  window.open(url, '_blank');
}

    sw.className = 'swatch' + (p.border === (currentBorder || selectedColor.border) ? ' selected' : '');

function colorFromShipment(s) {
  // stored as border hex, look up in palette
  if (s.colorBorder) {
    return PASTEL.find(p => p.border === s.colorBorder) || PASTEL[0];
  }
  // fallback: stable index for old data
  const idx = shipments.findIndex(x => x.id === s.id);
  return PASTEL[(idx < 0 ? 0 : idx) % PASTEL.length];
}

const MONTHS_TH = null; // legacy — unused, use t('months')[viewMonth]

// ─── RENDER ───────────────────────────────────────────────────────
function renderCal() {
  const yr = viewYear + I18N[lang].yearOffset;
  document.getElementById('monthLabel').textContent = `${t('months')[viewMonth]} ${yr}`;

  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';

  const firstDay    = new Date(viewYear, viewMonth, 1).getDay();
  const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
  const daysInPrev  = new Date(viewYear, viewMonth, 0).getDate();

  for (let i = 0; i < 42; i++) {
    let day, yr, mo, other = false;
    if (i < firstDay) {
      mo = viewMonth - 1; yr = viewYear; if (mo < 0) { mo = 11; yr--; }
      day = daysInPrev - firstDay + 1 + i; other = true;
    } else if (i >= firstDay + daysInMonth) {
      mo = viewMonth + 1; yr = viewYear; if (mo > 11) { mo = 0; yr++; }
      day = i - firstDay - daysInMonth + 1; other = true;
    } else {
      day = i - firstDay + 1; mo = viewMonth; yr = viewYear;
    }

    const dateStr = `${yr}-${pad(mo+1)}-${pad(day)}`;
    const isToday = yr === today.getFullYear() && mo === today.getMonth() && day === today.getDate();

    const cell = document.createElement('div');
    cell.className = 'day-cell' + (other ? ' other-month' : '') + (isToday ? ' today' : '');
    cell.dataset.date = dateStr;
    cell.innerHTML = `<div class="day-num">
      ${isToday ? `<span class="num-badge">${day}</span>` : `<span>${day}</span>`}
      ${showWk ? `<span class="wk-badge" style="font-size:9px;font-family:'IBM Plex Mono',monospace;font-weight:700;color:#5a6a8a;background:#eef1f8;border-radius:4px;padding:1px 5px;margin-left:4px">WK${isoWeek(yr,mo,day)}</span>` : ''}
      <span style="display:flex;align-items:center;gap:0">
        <button class="day-add-btn" title="เพิ่ม shipment">+</button>
        <button class="day-clear-btn" title="ลบข้อมูลทั้งหมดของวันนี้">🗑</button>
      </span>
    </div>`;

    // Real ship cards (by loading date)
    const lodCards = shipments.filter(s => s.lod === dateStr);
    if (lodCards.length === 0 && !other) {
      shipments.filter(s => s.cfd === dateStr && s.lod !== dateStr)
               .forEach(s => cell.appendChild(makeCard(s, true)));
    }
    lodCards.forEach(s => cell.appendChild(makeCard(s, false)));

    // Footprint cards for this date
    footprints.filter(fp => fp.date === dateStr)
              .forEach(fp => cell.appendChild(makeFootprint(fp)));

    cell.querySelector('.day-add-btn').addEventListener('click', e => {
      e.stopPropagation();
      openAdd(e.currentTarget.closest('.day-cell').dataset.date);
    });

    cell.querySelector('.day-clear-btn').addEventListener('click', e => {
      e.stopPropagation();
      const d = e.currentTarget.closest('.day-cell').dataset.date;
      const dayShips = shipments.filter(s => s.lod === d || s.cfd === d);
      const dayFPs   = footprints.filter(fp => fp.date === d);
      if (dayShips.length === 0 && dayFPs.length === 0) return;
      const names = dayShips.map(s => [s.wk, s.inv].filter(Boolean).join(' ')).join(', ');
      const msg = t('confirmClear')(fmtDate(d), names);
      if (!confirm(msg)) return;
      shipments  = shipments.filter(s  => s.lod !== d && s.cfd !== d);
      footprints = footprints.filter(fp => fp.date !== d);
      saveShip(); saveFP(); renderCal();
    });
    cell.addEventListener('dragover',  onDragOver);
    cell.addEventListener('dragleave', onDragLeave);
    cell.addEventListener('drop',      onDrop);

    grid.appendChild(cell);
  }
}

    ? `<span class="lb-badge ${lbClass(s.lbStatus)}">🏷 ${tLb(s.lbStatus)}</span>` : '';

  card.innerHTML = `
    <div class="card-top">
      <div>
        <div class="card-wk">${s.wk||'—'}${isCfd?' <span style="color:#c0392b">✂</span>':''}</div>
        <div class="card-inv">${s.inv||'—'}</div>
        ${s.invNo ? `<div class="card-invno" title="${s.invNo}" style="font-size:9px;font-family:'IBM Plex Mono',monospace;color:#5a6a8a;font-weight:600">#${s.invNo.slice(-4)}</div>` : ''}

function makeFootprint(fp) {

// ─── DRAG & DROP ──────────────────────────────────────────────────
let dragField = null; // 'cfd' or 'lod'

function onDragStart(e, id, field) {
  dragId    = id;
  dragField = field;
  const s   = shipments.find(x => x.id === id);
  dragOriginDate = field === 'lod' ? s.lod : s.cfd;

  const blank = document.createElement('canvas');
  blank.width = 1; blank.height = 1;
  e.dataTransfer.setDragImage(blank, 0, 0);
  e.dataTransfer.effectAllowed = 'move';

  setTimeout(() => {
    const card = document.querySelector(`.ship-card[data-id="${id}"]`);
    if (!card) return;
    card.classList.add('dragging');
    const r = card.getBoundingClientRect();
    const ghost = document.getElementById('dragGhost');
    ghost.innerHTML = card.innerHTML;
    ghost.className = card.className.replace('dragging','').trim();
    ghost.style.cssText = `display:block;width:${r.width}px;position:fixed;pointer-events:none;z-index:9998;opacity:0.88;transform:rotate(2deg) scale(1.04);box-shadow:0 8px 24px rgba(0,0,0,0.22);border-radius:7px;border-left:4px solid;padding:6px 8px;`;
    ghost.style.borderLeftColor = getComputedStyle(card).borderLeftColor;
    ghost.style.background      = getComputedStyle(card).background;
  }, 0);

  const fieldLabel = field === 'cfd' ? t('fpCfd') : t('fpLod');
  showToast(`${t('dragMoving')} ${fieldLabel}: ${s.wk||''} ${s.inv||''}`);
}

function onDragEnd(e) {
  document.getElementById('dragGhost').style.display = 'none';
  document.querySelectorAll('.ship-card.dragging').forEach(c => c.classList.remove('dragging'));
  document.querySelectorAll('.day-cell.drag-over').forEach(c => c.classList.remove('drag-over'));
  if (dragId) { // cancelled (no drop)
    dragId = null; dragField = null; dragOriginDate = null; dragOverCell = null; hideToast();
  }
}

document.addEventListener('dragover', e => {
  e.preventDefault();
  const ghost = document.getElementById('dragGhost');
  if (ghost.style.display === 'none') return;
  ghost.style.left = (e.clientX + 14) + 'px';
  ghost.style.top  = (e.clientY - 16) + 'px';
});

function onDragOver(e) {
  e.preventDefault(); e.dataTransfer.dropEffect = 'move';
  const cell = e.currentTarget;
  if (dragOverCell !== cell) {
    if (dragOverCell) dragOverCell.classList.remove('drag-over');
    dragOverCell = cell; cell.classList.add('drag-over');
  }
}

function onDragLeave(e) {
  const cell = e.currentTarget;
  if (!cell.contains(e.relatedTarget)) {
    cell.classList.remove('drag-over');
    if (dragOverCell === cell) dragOverCell = null;
  }
}

function onDrop(e) {
  e.preventDefault();
  const cell = e.currentTarget;
  cell.classList.remove('drag-over');

  if (!dragId) return;
  const newDate = cell.dataset.date;

  if (!newDate || newDate === dragOriginDate) {
    dragId = null; dragField = null; dragOriginDate = null; dragOverCell = null; hideToast(); return;
  }

  const idx = shipments.findIndex(x => x.id === dragId);
  if (idx === -1) return;

  const s = shipments[idx];
  const field = dragField; // 'cfd' or 'lod'
  const originDate = dragOriginDate;

  // Leave footprint only on the field being moved
  footprints.push({
    id:      uid(),
    date:    originDate,
    wk:      s.wk,
    inv:     s.inv,
    movedTo: newDate,
    type:    field,
  });
  saveFP();

  // Update only the dragged field
  shipments[idx] = { ...s, [field]: newDate };
  saveShip();

  dragId = null; dragField = null; dragOriginDate = null; dragOverCell = null;

  renderCal();
  const fieldLabel = field === 'cfd' ? t('fpCfd') : t('fpLod');
  showToast(t('dragToast')(fieldLabel, fmtDate(newDate)));
  setTimeout(hideToast, 3500);
}

// ─── TOAST ────────────────────────────────────────────────────────
let toastTimer;
function showToast(msg) {
  clearTimeout(toastTimer);
  const el = document.getElementById('dragToast');
  el.textContent = msg; el.classList.add('show');
}
function hideToast() {
  toastTimer = setTimeout(() => document.getElementById('dragToast').classList.remove('show'), 300);
}

  document.getElementById('formDelete').style.display = 'block';

  document.getElementById('fInv').value       = s.inv || '';

  ['fWk','fInv','fInvNo','fCntQty','fSoNum','fCfd','fLod'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('fCntStatus').value = '';
  document.getElementById('fSoStatus').value  = 'so_ok';
  document.getElementById('fLbStatus').value  = 'lb_notyet';
  buildCarrierSelect('');
}

function saveForm() {
  const data = {
    wk: document.getElementById('fWk').value.trim(),
    inv: document.getElementById('fInv').value.trim(),
    invNo: document.getElementById('fInvNo').value.trim(),
    cntStatus: document.getElementById('fCntStatus').value,
    cntQty: document.getElementById('fCntQty').value,
    soStatus: document.getElementById('fSoStatus').value,
    soNum: document.getElementById('fSoNum').value.trim(),
    carrier: document.getElementById('fCarrier').value,
    lbStatus: document.getElementById('fLbStatus').value,
    cfd: document.getElementById('fCfd').value,
    lod: document.getElementById('fLod').value,
    colorBorder: selectedColor.border,
  };
  if (!data.lod && !data.cfd) { alert(t('alertDate')); return; }
  if (editingId) {
    const idx = shipments.findIndex(x => x.id === editingId);
    shipments[idx] = { ...shipments[idx], ...data };
  } else {
    shipments.push({ id: uid(), ...data });
  }
  saveShip(); renderCal();
  document.getElementById('formModal').classList.remove('open');
}

function deleteEntry(id) {
  if (!confirm(t('confirmDel'))) return;
  shipments = shipments.filter(x => x.id !== id);
  _firebaseDeleteShip(id);
  saveShip(); renderCal();
  document.getElementById('formModal').classList.remove('open');
  closeDetail();
}

const CLOUDINARY_CLOUD = 'ddfsiikfh';
const CLOUDINARY_PRESET = 'shipment_uploads';

function renderPhotoGrid(s) {
  const grid = document.getElementById('photoGrid');
  const tabs = document.getElementById('photoTabs');
  if (!grid || !tabs) return;

  const ctnCount = (s._infographic && s._infographic.length) || 1;
  if (window._photoActiveCtn >= ctnCount) window._photoActiveCtn = 0;
  const activeCtn = window._photoActiveCtn || 0;

  // tabs
  if (ctnCount > 1) {
    tabs.innerHTML = Array.from({length: ctnCount}, (_, ci) => {
      const label = (s._infographic && s._infographic[ci]) ? `#${s._infographic[ci].ctnNo}` : `#${ci+1}`;
      const active = ci === activeCtn;
      return `<button onclick="switchPhotoTab('${s.id}',${ci})" style="padding:4px 10px;border-radius:6px;border:1px solid ${active?'#1e3a8a':'#e2e8f0'};background:${active?'#1e3a8a':'#fff'};color:${active?'#fff':'#5a6a8a'};font-size:11px;font-weight:600;cursor:pointer;font-family:inherit">${t('photoCtn')(label)}</button>`;
    }).join('');
  } else {
    tabs.innerHTML = '';
  }

  const allPhotos = s._photos || {};
  const photos = allPhotos[activeCtn] || [];
  grid.innerHTML = Array.from({length: 6}, (_, i) => {
    const url = photos[i];
    if (url) {
      return `<div style="position:relative;border-radius:8px;overflow:hidden;border:1px solid #e2e8f0;aspect-ratio:1">
        <img src="${url}" style="width:100%;height:100%;object-fit:cover;display:block" onclick="window.open('${url}','_blank')">
        <button onclick="deletePhoto('${s.id}',${activeCtn},${i})" style="position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,0.55);color:#fff;border:none;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center">✕</button>
      </div>`;
    }
    return `<label style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:1.5px dashed #c8d4ec;border-radius:8px;aspect-ratio:1;cursor:pointer;color:#9ca3af;font-size:10px;background:#fafbfe">
      📷
      <span>${t('photoSlot')(i+1)}</span>
      <input type="file" accept="image/*" capture="environment" style="display:none" onchange="uploadPhoto(event,'${s.id}',${activeCtn},${i})">
    </label>`;
  }).join('');
}

function switchPhotoTab(shipId, ci) {
  window._photoActiveCtn = ci;
  renderPhotoGrid(shipments.find(x => x.id === shipId));
}

async function uploadPhoto(e, shipId, ctnIdx, slotIdx) {
  const file = e.target.files[0];
  if (!file) return;
  const label = e.target.closest('label');
  label.style.opacity = '0.5';
  label.querySelector('span').textContent = t('photoUploading');

  try {
    const fd = new FormData();
    fd.append('file', file);
    fd.append('upload_preset', CLOUDINARY_PRESET);
    fd.append('folder', `shipments/${shipId}/ctn${ctnIdx+1}`);

    const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/image/upload`, {
      method: 'POST', body: fd
    });
    const data = await res.json();
    if (!data.secure_url) throw new Error(data.error?.message || 'upload failed');

    const s = shipments.find(x => x.id === shipId);
    if (!s._photos) s._photos = {};
    if (!s._photos[ctnIdx]) s._photos[ctnIdx] = [];
    s._photos[ctnIdx][slotIdx] = data.secure_url;
    saveShip();
    renderPhotoGrid(s);
    renderCal();
  } catch (err) {
    console.error(err);
    alert(t('photoUploadFail')(err.message));
    renderPhotoGrid(shipments.find(x => x.id === shipId));
  }
}

function deletePhoto(shipId, ctnIdx, slotIdx) {
  const s = shipments.find(x => x.id === shipId);
  if (!s || !s._photos || !s._photos[ctnIdx]) return;
  if (!confirm(t('photoConfirmDel'))) return;
  s._photos[ctnIdx].splice(slotIdx, 1);
  saveShip();
  renderPhotoGrid(s);
  renderCal();
}

<script type="module">
import { initializeApp }                        from 'https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js';
import { getFirestore, collection, doc, onSnapshot,
         setDoc, deleteDoc, getDocs }           from 'https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js';

// ─── CONFIG (ฝังตรงนี้เลย ไม่ต้อง setup) ─────────────────────────
const firebaseConfig = {
  apiKey:            "AIzaSyDyDKd9EDPy55AB0BEotMh3CKaE52dNaPY",
  authDomain:        "shipment-calendar-8cee8.firebaseapp.com",
  projectId:         "shipment-calendar-8cee8",
  storageBucket:     "shipment-calendar-8cee8.firebasestorage.app",
  messagingSenderId: "838455009882",
  appId:             "1:838455009882:web:65556cc4779f93abd7ae63"
};

// ─── INIT ─────────────────────────────────────────────────────────
const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

const SHIPS_COL = collection(db, 'shipments');
const FPS_COL   = collection(db, 'footprints');

setSyncStatus('syncing');

// ── Write to Firestore ─────────────────────────────────────────────
window._fbSaveShip = async (ships) => {
  setSyncStatus('syncing');
  try {
    const data = ships || [];
    const snap = await getDocs(SHIPS_COL);
    const remoteIds = new Set(snap.docs.map(d => d.id));
    const localIds  = new Set(data.map(s => s.id));
    for (const id of remoteIds) {
      if (!localIds.has(id)) await deleteDoc(doc(SHIPS_COL, id));
    }
    for (const s of data) {
      await setDoc(doc(SHIPS_COL, s.id), s);
    }
    setSyncStatus('ok');
  } catch(e) { console.error(e); setSyncStatus('err'); }
};

window._fbSaveFP = async (fps) => {
  setSyncStatus('syncing');
  try {
    const data = fps || [];
    const snap = await getDocs(FPS_COL);
    const remoteIds = new Set(snap.docs.map(d => d.id));
    const localIds  = new Set(data.map(f => f.id));
    for (const id of remoteIds) {
      if (!localIds.has(id)) await deleteDoc(doc(FPS_COL, id));
    }
    for (const fp of data) {
      await setDoc(doc(FPS_COL, fp.id), fp);
    }
    setSyncStatus('ok');
  } catch(e) { console.error(e); setSyncStatus('err'); }
};

window._fbDeleteShip = async (id) => {
  setSyncStatus('syncing');
  try {
    await deleteDoc(doc(SHIPS_COL, id));
    setSyncStatus('ok');
  } catch(e) { console.error(e); setSyncStatus('err'); }
};

// ── Real-time listeners ────────────────────────────────────────────
onSnapshot(SHIPS_COL, snap => {
  document.dispatchEvent(new CustomEvent('fb:ships', { detail: snap.docs.map(d => d.data()) }));
  setSyncStatus('ok');
}, e => { console.error(e); setSyncStatus('err'); });

onSnapshot(FPS_COL, snap => {
  document.dispatchEvent(new CustomEvent('fb:fps', { detail: snap.docs.map(d => d.data()) }));
});

window._calReady = true;

// ─── SYNC DOT ─────────────────────────────────────────────────────
function setSyncStatus(s) {
  const dot = document.getElementById('syncDot');
  const txt = document.getElementById('syncStatus');
  if (!dot) return;
  dot.className = s;
  txt.textContent = s === 'ok' ? 'Synced' : s === 'syncing' ? 'Syncing…' : 'Error';
}
</script>
